    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        // Otwieranie i zamykanie menu mobilnego
        menuToggle.addEventListener('click', () => {
            const isOpen =
                menuToggle.getAttribute('aria-expanded') === 'true';

            menuToggle.setAttribute('aria-expanded', String(!isOpen));
            menuToggle.setAttribute(
                'aria-label',
                isOpen ? 'Otwórz menu' : 'Zamknij menu'
            );

            navLinks.classList.toggle('menu-open', !isOpen);
        });

        // Zamykanie menu po wybraniu zwykłego linku
        navLinks.querySelectorAll('a:not(.nav-submenu a)').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('menu-open');
                menuToggle.setAttribute('aria-expanded', 'false');
                menuToggle.setAttribute('aria-label', 'Otwórz menu');
            });
        });

        // Rozwijanie listy Portfolio
        const portfolioToggle =
            document.querySelector('.nav-dropdown-toggle');
        const portfolioDropdown =
            document.querySelector('.nav-dropdown');

        portfolioToggle.addEventListener('click', () => {
            const isOpen =
                portfolioToggle.getAttribute('aria-expanded') === 'true';

            portfolioToggle.setAttribute(
                'aria-expanded',
                String(!isOpen)
            );

            portfolioDropdown.classList.toggle('submenu-open', !isOpen);
        });

        // Zamykanie listy po kliknięciu poza Portfolio
        document.addEventListener('click', event => {
            if (!portfolioDropdown.contains(event.target)) {
                portfolioDropdown.classList.remove('submenu-open');
                portfolioToggle.setAttribute('aria-expanded', 'false');
            }
        });

        // Zamykanie listy klawiszem Escape
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                portfolioDropdown.classList.remove('submenu-open');
                portfolioToggle.setAttribute('aria-expanded', 'false');
            }
        });
    </script>
<script src="lightbox.js"></script>
