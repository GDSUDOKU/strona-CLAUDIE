    <main>
        <section id="kontakt" class="contact-section">

            <div class="contact-heading">
                <p class="script-label">napisz do mnie</p>
                <h2>Stwórzmy razem coś pięknego</h2>
                <p>
                    Opowiedz mi o swojej wymarzonej sesji.
                    Wspólnie stworzymy coś wyjątkowego.
                </p>
            </div>

            <form
                class="contact-form"
                action="https://formsubmit.co/eosindove@gmail.com"
                method="POST"
            >

                <input
                    type="hidden"
                    name="_subject"
                    value="Nowe zapytanie o sesję — CLAUDIE"
                >

                <input
                    type="hidden"
                    name="_captcha"
                    value="true"
                >

                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">Imię *</label>
                        <input
                            type="text"
                            id="first-name"
                            name="Imię"
                            placeholder="Twoje imię"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="last-name">Nazwisko</label>
                        <input
                            type="text"
                            id="last-name"
                            name="Nazwisko"
                            placeholder="Twoje nazwisko"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Adres e-mail *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="twoj@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="service">Rodzaj sesji *</label>
                    <select id="service" name="Rodzaj sesji" required>
                        <option value="">Wybierz rodzaj sesji</option>
                        <option>Sesja portretowa</option>
                        <option>Sesja pary lub narzeczeńska</option>
                        <option>Sesja rodzinna lub ciążowa</option>
                        <option>Fotografia ślubna</option>
                        <option>Sesja wizerunkowa</option>
                        <option>Inna sesja</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budget">Planowany budżet</label>
                    <select id="budget" name="Budżet">
                        <option value="">Wybierz budżet</option>
                        <option>Do 500 zł</option>
                        <option>500–1000 zł</option>
                        <option>Powyżej 1000 zł</option>
                        <option>Do ustalenia</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Opowiedz o swojej sesji *</label>
                    <textarea
                        id="message"
                        name="Wiadomość"
                        rows="5"
                        placeholder="Jaki masz pomysł? Kiedy planujesz sesję?"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="button">
                    WYŚLIJ ZAPYTANIE
                </button>

            </form>
        </section>
    </main>

    <footer>
        © 2026 CLAUDIE
    </footer>

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        // Otwieranie i zamykanie menu mobilnego
        menuToggle.addEventListener('click', () => {
            const isOpen =
                menuToggle.getAttribute('aria-expanded') === 'true';

            menuToggle.setAttribute('aria-expanded', String(!isOpen));
            menuToggle.setAttribute(
                'aria-label',
                isOpen ? 'Otwórz menu' : 'Zamknij menu'
            );

            navLinks.classList.toggle('menu-open', !isOpen);
        });

        // Zamykanie menu mobilnego po wybraniu linku
        navLinks.querySelectorAll('a:not(.nav-submenu a)').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('menu-open');
                menuToggle.setAttribute('aria-expanded', 'false');
                menuToggle.setAttribute('aria-label', 'Otwórz menu');
            });
        });

        // Rozwijanie listy Portfolio
        const portfolioToggle =
            document.querySelector('.nav-dropdown-toggle');
        const portfolioDropdown =
            document.querySelector('.nav-dropdown');

        portfolioToggle.addEventListener('click', () => {
            const isOpen =
                portfolioToggle.getAttribute('aria-expanded') === 'true';

            portfolioToggle.setAttribute(
                'aria-expanded',
                String(!isOpen)
            );

            portfolioDropdown.classList.toggle('submenu-open', !isOpen);
        });

        // Zamykanie listy po kliknięciu poza nią
        document.addEventListener('click', event => {
            if (!portfolioDropdown.contains(event.target)) {
                portfolioDropdown.classList.remove('submenu-open');
                portfolioToggle.setAttribute('aria-expanded', 'false');
            }
        });

        // Zamykanie listy klawiszem Escape
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                portfolioDropdown.classList.remove('submenu-open');
                portfolioToggle.setAttribute('aria-expanded', 'false');
            }
        });
    </script>
